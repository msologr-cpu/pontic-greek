name: Build Windows EXE

on:
  push:
    paths:
      - 'PonticKeyboard.ahk'
      - 'PonticKeyboard_v2.ahk'
      - 'pontic_windows.ahk'
      - 'PonticKeyboard_v3.ahk'
      - 'PonticKeyboard_v3_3keys.ahk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup AutoHotkey v2 with compiler
        shell: pwsh
        run: |
          # 1. Download AHK v2 portable
          $release = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest"
          Write-Output "AHK release: $($release.tag_name)"
          $zipAsset = $release.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          Invoke-WebRequest -Uri $zipAsset.browser_download_url -OutFile "ahk.zip"
          Expand-Archive -Path "ahk.zip" -DestinationPath "ahk" -Force
          
          # 2. Download Ahk2Exe compiler
          $compRelease = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          Write-Output "Ahk2Exe release: $($compRelease.tag_name)"
          $compAsset = $compRelease.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          if ($compAsset) {
            Invoke-WebRequest -Uri $compAsset.browser_download_url -OutFile "ahk2exe.zip"
            New-Item -ItemType Directory -Path "ahk/Compiler" -Force | Out-Null
            Expand-Archive -Path "ahk2exe.zip" -DestinationPath "ahk/Compiler" -Force
          } else {
            # Fallback: download Ahk2Exe.exe directly from source
            Invoke-WebRequest -Uri "https://github.com/AutoHotkey/Ahk2Exe/releases/latest/download/Ahk2Exe.exe" -OutFile "ahk/Compiler/Ahk2Exe.exe"
          }
          
          Write-Output "=== AHK directory ==="
          Get-ChildItem "ahk" -Recurse -Filter "*.exe" | Select-Object FullName

      - name: Compile PonticKeyboard.exe (unified)
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "ahk" -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1
          if (-not $compiler) { Write-Error "Ahk2Exe.exe not found"; exit 1 }
          $ahkExe = Get-ChildItem "ahk" -Filter "AutoHotkey*.exe" | Select-Object -First 1
          Write-Output "Compiler: $($compiler.FullName)"
          Write-Output "Base: $($ahkExe.FullName)"
          & "$($compiler.FullName)" /in "PonticKeyboard.ahk" /out "PonticKeyboard.exe" /base "$($ahkExe.FullName)"
          Start-Sleep -Seconds 3
          if (Test-Path "PonticKeyboard.exe") {
            Write-Output "OK: PonticKeyboard.exe $($(Get-Item 'PonticKeyboard.exe').Length) bytes"
          } else { Write-Error "Failed"; exit 1 }

      - name: Compile PonticKeyboard_v2.exe (split keys)
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "ahk" -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1
          $ahkExe = Get-ChildItem "ahk" -Filter "AutoHotkey*.exe" | Select-Object -First 1
          & "$($compiler.FullName)" /in "PonticKeyboard_v2.ahk" /out "PonticKeyboard_v2.exe" /base "$($ahkExe.FullName)"
          Start-Sleep -Seconds 3
          if (Test-Path "PonticKeyboard_v2.exe") {
            Write-Output "OK: PonticKeyboard_v2.exe $($(Get-Item 'PonticKeyboard_v2.exe').Length) bytes"
          } else { Write-Error "Failed"; exit 1 }

      - name: Compile PonticKeyboard_v3.exe
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "ahk" -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1
          $ahkExe = Get-ChildItem "ahk" -Filter "AutoHotkey*.exe" | Select-Object -First 1
          & "$($compiler.FullName)" /in "PonticKeyboard_v3.ahk" /out "PonticKeyboard_v3.exe" /base "$($ahkExe.FullName)"
          Start-Sleep -Seconds 3
          if (Test-Path "PonticKeyboard_v3.exe") {
            Write-Output "OK: PonticKeyboard_v3.exe $($(Get-Item 'PonticKeyboard_v3.exe').Length) bytes"
          } else { Write-Error "Failed"; exit 1 }

      - name: Compile PonticKeyboard_v3_3keys.exe
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "ahk" -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1
          $ahkExe = Get-ChildItem "ahk" -Filter "AutoHotkey*.exe" | Select-Object -First 1
          & "$($compiler.FullName)" /in "PonticKeyboard_v3_3keys.ahk" /out "PonticKeyboard_v3_3keys.exe" /base "$($ahkExe.FullName)"
          Start-Sleep -Seconds 3
          if (Test-Path "PonticKeyboard_v3_3keys.exe") {
            Write-Output "OK: PonticKeyboard_v3_3keys.exe $($(Get-Item 'PonticKeyboard_v3_3keys.exe').Length) bytes"
          } else { Write-Error "Failed"; exit 1 }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PonticKeyboard
          path: |
            PonticKeyboard.exe
            PonticKeyboard_v2.exe
            PonticKeyboard_v3.exe
            PonticKeyboard_v3_3keys.exe

      - name: Commit EXEs to repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PonticKeyboard.exe PonticKeyboard_v2.exe PonticKeyboard_v3.exe PonticKeyboard_v3_3keys.exe
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: rebuild PonticKeyboard exe files (auto)"
            git push
          fi
