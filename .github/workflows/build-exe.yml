name: Build Windows EXE

on:
  push:
    paths:
      - 'PonticKeyboard.ahk'
      - 'pontic_windows.ahk'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AutoHotkey v2 portable
        shell: pwsh
        run: |
          # Get latest release info
          $release = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest"
          Write-Output "Latest release: $($release.tag_name)"
          
          # Find the zip asset (portable)
          $zipAsset = $release.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          if (-not $zipAsset) {
            Write-Error "No zip asset found in release"
            Write-Output "Available assets:"
            $release.assets | ForEach-Object { Write-Output "  $($_.name)" }
            exit 1
          }
          
          Write-Output "Downloading: $($zipAsset.name)"
          Invoke-WebRequest -Uri $zipAsset.browser_download_url -OutFile "ahk.zip"
          
          # Extract
          Expand-Archive -Path "ahk.zip" -DestinationPath "ahk" -Force
          Write-Output "Extracted contents:"
          Get-ChildItem "ahk" -Recurse -Filter "*.exe" | Select-Object FullName

      - name: Compile to EXE
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "ahk" -Recurse -Filter "Ahk2Exe.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) {
            Write-Error "Ahk2Exe.exe not found in portable distribution"
            Get-ChildItem "ahk" -Recurse | Select-Object FullName
            exit 1
          }
          Write-Output "Using compiler: $($compiler.FullName)"
          & "$($compiler.FullName)" /in "PonticKeyboard.ahk" /out "PonticKeyboard.exe"
          Start-Sleep -Seconds 3
          if (-not (Test-Path "PonticKeyboard.exe")) {
            Write-Error "Compilation failed"
            exit 1
          }
          Write-Output "Success: PonticKeyboard.exe created"
          Get-Item "PonticKeyboard.exe" | Select-Object Name, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PonticKeyboard
          path: PonticKeyboard.exe

      - name: Commit EXE to repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PonticKeyboard.exe
          if git diff --staged --quiet; then
            echo "No changes to EXE"
          else
            git commit -m "chore: rebuild PonticKeyboard.exe (auto)"
            git push
          fi
