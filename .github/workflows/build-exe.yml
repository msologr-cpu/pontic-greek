name: Build Windows EXE

on:
  push:
    paths:
      - 'PonticKeyboard.ahk'
      - 'pontic_windows.ahk'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey v2
        shell: pwsh
        run: |
          # Download AHK v2 installer from GitHub releases
          $release = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '.*Setup\.exe$' } | Select-Object -First 1
          if (-not $asset) {
            # Fallback: try direct download
            $asset = $release.assets | Where-Object { $_.name -match '\.exe$' } | Select-Object -First 1
          }
          Write-Output "Downloading: $($asset.browser_download_url)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "ahk-setup.exe"
          
          # Silent install
          Start-Process -FilePath ".\ahk-setup.exe" -ArgumentList "/S" -Wait -NoNewWindow
          Start-Sleep -Seconds 5
          
          # Find installation
          $searchPaths = @(
            "C:\Program Files\AutoHotkey",
            "$env:LOCALAPPDATA\Programs\AutoHotkey",
            "C:\Program Files (x86)\AutoHotkey"
          )
          foreach ($base in $searchPaths) {
            if (Test-Path $base) {
              Write-Output "Found AHK at: $base"
              Get-ChildItem $base -Recurse -Filter "*.exe" | Select-Object FullName
            }
          }

      - name: Compile to EXE
        shell: pwsh
        run: |
          # Search for Ahk2Exe compiler
          $searchPaths = @(
            "C:\Program Files\AutoHotkey",
            "$env:LOCALAPPDATA\Programs\AutoHotkey",
            "C:\Program Files (x86)\AutoHotkey"
          )
          $compiler = $null
          foreach ($base in $searchPaths) {
            $found = Get-ChildItem $base -Recurse -Filter "Ahk2Exe.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $compiler = $found.FullName
              break
            }
          }
          if (-not $compiler) {
            Write-Error "Ahk2Exe.exe not found in any search path"
            exit 1
          }
          Write-Output "Using compiler: $compiler"
          & "$compiler" /in "PonticKeyboard.ahk" /out "PonticKeyboard.exe"
          if (-not (Test-Path "PonticKeyboard.exe")) {
            Write-Error "Compilation failed — PonticKeyboard.exe not created"
            exit 1
          }
          Write-Output "Successfully compiled PonticKeyboard.exe"
          Get-Item "PonticKeyboard.exe" | Select-Object Name, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PonticKeyboard
          path: PonticKeyboard.exe

      - name: Commit EXE to repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PonticKeyboard.exe
          if git diff --staged --quiet; then
            echo "No changes to EXE"
          else
            git commit -m "chore: rebuild PonticKeyboard.exe (auto)"
            git push
          fi
